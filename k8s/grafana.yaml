apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:

      - name: grafana

        image: grafana/grafana:10.4.2

        ports:
          - containerPort: 3000

        volumeMounts:
          - name: grafana-datasource
            mountPath: /etc/grafana/provisioning/datasources
            readOnly: true
          - name: grafana-dashboards-config
            mountPath: /etc/grafana/provisioning/dashboards
            readOnly: true
          - name: grafana-dashboard
            mountPath: /var/lib/grafana/dashboards
            readOnly: true


        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboard
          configMap:
            name: grafana-dashboard
