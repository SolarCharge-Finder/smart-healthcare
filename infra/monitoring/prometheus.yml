global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['auth-service:8080']
  - job_name: appointment-service
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["appointment-service:8080"]

  - job_name: notification-service
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["notification-service:8080"]
