services:

  postgres:
    image: postgres:15
    container_name: sh-postgres
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management
    container_name: sh-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    container_name: sh-redis
    command: ["redis-server", "--requirepass", "redispass"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ../backend/AuthService
    container_name: sh-authentication
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Jwt_Key: ${JWT_KEY}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=authdb;Username=postgres;Password=admin
      App_FrontendUrl: ${APP_FRONTEND_URL}
    ports:
      - "5001:8080"

  patient-service: 
    build: ../backend/PatientService
    container_name: sh-patient
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=patientdb;Username=postgres;Password=admin
    ports:
      - "5002:8080"
  
  doctor-service: 
    build: ../backend/DoctorService
    container_name: sh-doctor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=doctordb;Username=postgres;Password=admin
    ports:
      - "5003:8080"

  admin-service: 
    build: ../backend/AdminService
    container_name: sh-admin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=admindb;Username=postgres;Password=admin
    ports:
      - "5004:8080"

  appointment-service:
    build: ../backend/AppointmentService
    container_name: sh-appointment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      Frontend__Origin: http://localhost:3000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=appointmentdb;Username=postgres;Password=admin
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: guest
      RabbitMQ__Password: guest
      Redis__ConnectionString: redis:6379,password=redispass,abortConnect=False
    ports:
      - "8080:8080"

  ai-service:
    build: ../backend/AIService
    container_name: sh-ai-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=aidb;Username=postgres;Password=admin
      ConnectionStrings__Redis: redis:6379,password=redispass,abortConnect=False
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-proj-}
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped


  notification-service:
    build: ../backend/NotificationService
    container_name: sh-notification
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=notificationdb;Username=postgres;Password=admin
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: auth-service
      Jwt__Audience: smart-healthcare
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: guest
      RabbitMQ__Password: guest
    ports:
      - "8082:8080"
    restart: always


  telemedicine-service:
    build: ../backend/TelemedicineService
    container_name: sh-telemedicine
    depends_on:
      postgres:
        condition: service_healthy
      appointment-service:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=telemedicinedb;Username=postgres;Password=admin
      AppointmentService__BaseUrl: http://appointment-service:8080/
      Frontend__Origin: http://localhost:3000
      Agora__AppId: ${NEXT_PUBLIC_AGORA_APP_ID}
      Agora__AppCertificate: ${AGORA_APP_CERTIFICATE}
      Agora__TokenExpirySeconds: 3600
    ports:
      - "5005:8080"


  payment-service:
    build: ../backend/PaymentService
    container_name: sh-payment
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=appointmentdb;Username=postgres;Password=admin
      API_KEY: dev-key
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "8081:8080"


  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: sh-prometheus
    depends_on:
      appointment-service:
        condition: service_started
      notification-service:
        condition: service_started
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"


  grafana:
    image: grafana/grafana:10.4.2
    container_name: sh-grafana
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"


volumes:
  pgdata:
