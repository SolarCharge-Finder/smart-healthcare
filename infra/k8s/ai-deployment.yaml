apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
      - name: ai-service
        image: smarthealth-ai-service:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production

        - name: Database__UseInMemory
          value: "false"

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: POSTGRES_PASSWORD

        - name: ConnectionStrings__DefaultConnection
          value: Host=postgres;Port=5432;Database=aidb;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)

        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: REDIS_PASSWORD

        - name: ConnectionStrings__Redis
          value: redis:6379,password=$(REDIS_PASSWORD),abortConnect=False

        - name: RabbitMQ__Host
          value: rabbitmq

        - name: RabbitMQ__Port
          value: "5672"

        - name: RabbitMQ__User
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: RABBITMQ_DEFAULT_USER

        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: RABBITMQ_DEFAULT_PASS

        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: OPENAI_API_KEY

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
