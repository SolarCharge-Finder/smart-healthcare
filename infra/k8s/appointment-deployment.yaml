apiVersion: apps/v1
kind: Deployment

metadata:
  name: appointment-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: appointment-service

  template:
    metadata:
      labels:
        app: appointment-service

    spec:
      containers:

      - name: appointment-service

        image: smarthealth-appointment-service:latest

        imagePullPolicy: IfNotPresent

        ports:
          - containerPort: 8080


        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi


        env:

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: POSTGRES_PASSWORD

        - name: ConnectionStrings__DefaultConnection
          value: Host=postgres;Port=5432;Database=appointmentdb;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)

        - name: RabbitMQ__Host
          value: rabbitmq

        - name: RabbitMQ__User
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: RABBITMQ_DEFAULT_USER

        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: RABBITMQ_DEFAULT_PASS

        - name: Redis__Host
          value: redis:6379

        - name: Redis__Password
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: REDIS_PASSWORD

        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: smarthealth-secrets
              key: API_KEY


        livenessProbe:

          httpGet:
            path: /health/live
            port: 8080

          initialDelaySeconds: 10
          periodSeconds: 5


        readinessProbe:

          httpGet:
            path: /health/ready
            port: 8080

          initialDelaySeconds: 10
          periodSeconds: 5
