apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: backend-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development

# Database connection settings
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: authdb

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: POSTGRES_PASSWORD

            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres;Port=5432;Database=authdb;Username=postgres;Password=admin
            - name: Jwt__Key
              value: this-is-a-very-secure-super-long-key-123456789
            - name: Jwt__Issuer
              value: auth-service
            - name: Jwt__Audience
              value: smart-healthcare