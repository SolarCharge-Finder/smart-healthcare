apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: smarthealth-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - smarthealth.local
    secretName: smarthealth-tls

  rules:
  - host: smarthealth.local
    http:
      paths:
      - path: /api/ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 80
