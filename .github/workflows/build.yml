name: build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_healthcare_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d smart_healthcare_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json

      - name: restore
        run: dotnet restore smart-healthcare.sln

      - name: build
        run: dotnet build smart-healthcare.sln --configuration Release --no-restore

      - name: test (if any)
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5433;Database=smart_healthcare_test;Username=postgres;Password=postgres;Include Error Detail=true
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          set -e
          if find backend -name "*Tests.csproj" -print -quit | grep -q .; then
            dotnet test smart-healthcare.sln --configuration Release --no-build
          else
            echo "No test projects found, skipping."
          fi

      - name: dotnet format (verify)
        run: |
          dotnet tool install -g dotnet-format
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet format smart-healthcare.sln --verify-no-changes

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm ci
        working-directory: frontend

      - name: lint frontend (if configured)
        run: |
          set -e
          if ls frontend/.eslintrc.* >/dev/null 2>&1 || [ -f frontend/eslint.config.* ]; then
            npm run lint
          else
            echo "No ESLint config found, skipping."
          fi
        working-directory: frontend

      - name: build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
        working-directory: frontend

      - name: normalize image repository
        id: image_meta
        if: github.ref == 'refs/heads/main'
        run: echo "repository_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v4
        if: github.ref == 'refs/heads/main'

      - name: login to ghcr
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push appointment service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend/AppointmentService
          file: backend/AppointmentService/Dockerfile
          push: true
          cache-from: type=gha,scope=appointment-service
          cache-to: type=gha,scope=appointment-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/appointment-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/appointment-service:${{ github.sha }}

      - name: build and push notification service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend/NotificationService
          file: backend/NotificationService/Dockerfile
          push: true
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,scope=notification-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/notification-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/notification-service:${{ github.sha }}

      - name: build and push auth service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend
          file: backend/AuthService/Dockerfile
          push: true
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,scope=auth-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/auth-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/auth-service:${{ github.sha }}

      - name: build and push doctor service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend
          file: backend/DoctorService/Dockerfile
          push: true
          cache-from: type=gha,scope=doctor-service
          cache-to: type=gha,scope=doctor-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/doctor-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/doctor-service:${{ github.sha }}

      - name: build and push admin service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend
          file: backend/AdminService/Dockerfile
          push: true
          cache-from: type=gha,scope=admin-service
          cache-to: type=gha,scope=admin-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/admin-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/admin-service:${{ github.sha }}

      - name: build and push patient service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend
          file: backend/PatientService/Dockerfile
          push: true
          cache-from: type=gha,scope=patient-service
          cache-to: type=gha,scope=patient-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/patient-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/patient-service:${{ github.sha }}

      - name: build and push payment service
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: backend/PaymentService
          file: backend/PaymentService/Dockerfile
          push: true
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,scope=payment-service,mode=max
          tags: |
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/payment-service:latest
            ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/payment-service:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: verify kubeconfig
        id: kubeconfig
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBECONFIG secret is missing. Skipping deploy steps."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: setup kubectl
        uses: azure/setup-kubectl@v4
        if: steps.kubeconfig.outputs.enabled == 'true'

      - name: configure kubeconfig
        if: steps.kubeconfig.outputs.enabled == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config

      - name: normalize image repository
        id: image_meta
        if: steps.kubeconfig.outputs.enabled == 'true'
        run: echo "repository_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: apply manifests
        if: steps.kubeconfig.outputs.enabled == 'true'
        run: |
          kubectl apply -f infra/k8s

      - name: update images
        if: steps.kubeconfig.outputs.enabled == 'true'
        run: |
          kubectl set image deployment/appointment-deployment \
            appointment-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/appointment-service:${{ github.sha }}
          kubectl set image deployment/notification-deployment \
            notification-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/notification-service:${{ github.sha }}
          kubectl set image deployment/auth-deployment \
            auth-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/auth-service:${{ github.sha }}
          kubectl set image deployment/doctor-deployment \
            doctor-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/doctor-service:${{ github.sha }}
          kubectl set image deployment/admin-deployment \
            admin-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/admin-service:${{ github.sha }}
          kubectl set image deployment/patient-deployment \
            patient-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/patient-service:${{ github.sha }}
          kubectl set image deployment/payment-deployment \
            payment-service=ghcr.io/${{ steps.image_meta.outputs.repository_lower }}/payment-service:${{ github.sha }}

      - name: verify rollout
        if: steps.kubeconfig.outputs.enabled == 'true'
        run: |
          kubectl rollout status deployment/auth-deployment --timeout=120s
          kubectl rollout status deployment/doctor-deployment --timeout=120s
          kubectl rollout status deployment/admin-deployment --timeout=120s
          kubectl rollout status deployment/patient-deployment --timeout=120s
          kubectl rollout status deployment/payment-deployment --timeout=120s
