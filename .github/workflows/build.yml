name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: restore
      run: dotnet restore SmartHealthcare.slnx

    - name: build
      run: dotnet build SmartHealthcare.slnx --configuration Release --no-restore

    - name: test (if any)
      run: |
        set -e
        if find . -name "*Tests.csproj" -print -quit | grep -q .; then
          dotnet test SmartHealthcare.slnx --configuration Release --no-build
        else
          echo "No test projects found, skipping."
        fi

    - name: setup docker buildx
      uses: docker/setup-buildx-action@v3

    - name: login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: build and push appointment service
      uses: docker/build-push-action@v5
      with:
        context: AppointmentService
        file: AppointmentService/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ github.repository }}/appointment-service:latest
          ghcr.io/${{ github.repository }}/appointment-service:${{ github.sha }}

    - name: build and push notification service
      uses: docker/build-push-action@v5
      with:
        context: NotificationService
        file: NotificationService/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ github.repository }}/notification-service:latest
          ghcr.io/${{ github.repository }}/notification-service:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && secrets.KUBECONFIG != '' }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup kubectl
      uses: azure/setup-kubectl@v4

    - name: configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

    - name: apply manifests
      run: |
        kubectl apply -f k8s

    - name: update images
      run: |
        kubectl set image deployment/appointment-deployment \
          appointment-service=ghcr.io/${{ github.repository }}/appointment-service:${{ github.sha }}
        kubectl set image deployment/notification-deployment \
          notification-service=ghcr.io/${{ github.repository }}/notification-service:${{ github.sha }}
