name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true

      - name: restore
        run: dotnet restore backend/SmartHealthcare.slnx

      - name: build
        run: dotnet build backend/SmartHealthcare.slnx --configuration Release --no-restore

      - name: test (if any)
        run: |
          set -e
          if find backend -name "*Tests.csproj" -print -quit | grep -q .; then
            dotnet test backend/SmartHealthcare.slnx --configuration Release --no-build
          else
            echo "No test projects found, skipping."
          fi

      - name: dotnet format (verify)
        run: |
          dotnet tool install -g dotnet-format
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet format backend/SmartHealthcare.slnx --verify-no-changes

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm ci
        working-directory: frontend

      - name: lint frontend (if configured)
        run: |
          set -e
          if ls frontend/.eslintrc.* >/dev/null 2>&1 || [ -f frontend/eslint.config.* ]; then
            npm run lint
          else
            echo "No ESLint config found, skipping."
          fi
        working-directory: frontend

      - name: build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
        working-directory: frontend

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - name: login to ghcr
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push appointment service
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/main'
        with:
          context: backend/AppointmentService
          file: backend/AppointmentService/Dockerfile
          push: true
          cache-from: type=gha,scope=appointment-service
          cache-to: type=gha,scope=appointment-service,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/appointment-service:latest
            ghcr.io/${{ github.repository }}/appointment-service:${{ github.sha }}

      - name: build and push notification service
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/main'
        with:
          context: backend/NotificationService
          file: backend/NotificationService/Dockerfile
          push: true
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,scope=notification-service,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/notification-service:latest
            ghcr.io/${{ github.repository }}/notification-service:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: verify kubeconfig
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG secret is missing. Aborting deploy."
            exit 1
          fi

      - name: setup kubectl
        uses: azure/setup-kubectl@v4

      - name: configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config

      - name: apply manifests
        run: |
          kubectl apply -f infra/k8s

      - name: update images
        run: |
          kubectl set image deployment/appointment-deployment \
            appointment-service=ghcr.io/${{ github.repository }}/appointment-service:${{ github.sha }}
          kubectl set image deployment/notification-deployment \
            notification-service=ghcr.io/${{ github.repository }}/notification-service:${{ github.sha }}
